<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trivia Quiz</title><style>
body{font-family:Arial;margin:0;background:#eef2ff;display:grid;place-items:center;min-height:100vh}.box{width:min(92%,650px);background:white;padding:28px;border-radius:20px;box-shadow:0 10px 30px #0002}button{display:block;width:100%;margin:10px 0;padding:13px;border:0;border-radius:10px;background:#4f46e5;color:white;cursor:pointer}button.answer{background:#e5e7eb;color:#111}.hidden{display:none}.score{font-size:20px;font-weight:bold}
</style></head><body><div class="box"><h1>🧠 Trivia Quiz</h1><div id="quiz"><p id="progress"></p><h2 id="question">Loading...</h2><div id="answers"></div></div><div id="result" class="hidden"></div></div>
<script>
let questions=[],index=0,score=0;
async function start(){try{
 const r=await fetch("https://opentdb.com/api.php?amount=10&type=multiple"); const d=await r.json();
 questions=d.results; show();
}catch(e){document.getElementById("question").textContent="Could not load questions. Refresh and try again."}}
function decode(s){let t=document.createElement("textarea");t.innerHTML=s;return t.value}
function show(){let q=questions[index];document.getElementById("progress").textContent=`Question ${index+1} of ${questions.length} | Score: ${score}`;
document.getElementById("question").textContent=decode(q.question);let arr=[...q.incorrect_answers,q.correct_answer].sort(()=>Math.random()-.5);
document.getElementById("answers").innerHTML="";arr.forEach(a=>{let b=document.createElement("button");b.className="answer";b.textContent=decode(a);b.onclick=()=>choose(a===q.correct_answer);document.getElementById("answers").appendChild(b)})}
function choose(ok){if(ok)score++;index++;if(index<questions.length)show();else{document.getElementById("quiz").classList.add("hidden");document.getElementById("result").classList.remove("hidden");document.getElementById("result").innerHTML=`<h2>🎉 Quiz Complete!</h2><p class="score">Your score: ${score}/${questions.length}</p><button onclick="location.reload()">Play Again</button>`}}
start();
</script></body></html>
